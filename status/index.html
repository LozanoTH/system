<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facturación</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="led-panel card">
    <div class="card-head">
      <h2>Estado de la base de datos</h2>
      <button class="btn btn-ghost" id="btn-led" type="button">Comprobar ahora</button>
    </div>
    <div class="card-body">
      <div class="led-cuerpo">
        <span class="led led-conectando" id="led" role="img" aria-label="Estado de la base de datos"></span>
        <div>
          <p class="led-titulo" id="led-titulo">Conectando con la base de datos…</p>
          <p class="led-detalle" id="led-mensaje">Verificando la conexión…</p>
        </div>
      </div>

      <div class="led-meta">
        <span class="led-chip">URL <code id="led-url"></code></span>
        <span class="led-chip">Latencia <b id="led-latencia">—</b></span>
        <span class="led-chip">Última lectura <b id="led-hora">—</b></span>
        <span class="led-chip">Internet <b id="led-online">—</b></span>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../js/config.js"></script>
<script src="../js/db.js"></script>
<script src="../js/led.js"></script>
</body>
</html>
