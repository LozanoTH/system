<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación POS</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Punto de venta: catálogo, carrito, cobro e impresión de facturas.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F172A'/><text x='16' y='23' font-family='sans-serif' font-size='18' font-weight='bold' fill='%23fff' text-anchor='middle'>F</text></svg>">
    <noscript>
        <!-- Sin JavaScript no se puede leer el user agent: por defecto, escritorio. -->
        <meta http-equiv="refresh" content="0; url=pc.html">
    </noscript>
    <script>
        /* Puerta de entrada: según el user agent envía a la versión móvil o a la de PC.
           Se conserva la query string (?vista=..., etc.) para que el destino la reciba. */
        (function () {
            var esMovil = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i
                .test(navigator.userAgent);
            var destino = esMovil ? "movil/" : "pc.html";
            if (location.search) destino += location.search;
            location.replace(destino);
        })();
    </script>
</head>
<body>
    <p>Redirigiendo… Si no ocurre automáticamente, <a href="pc.html">abrir la versión de escritorio</a>.</p>
</body>
</html>
